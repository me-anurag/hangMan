<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Conway's Game of Life</title>
    <link rel="stylesheet" href="styleG.css">
</head>
<body>

    <h1>Conway's Game of Life</h1>

    <canvas id="gameCanvas"></canvas>

    <div class="controls">
        <button onclick="startGame()">Start</button>
        <button onclick="stopGame()">Stop</button>
        <button onclick="clearGrid()">Clear</button>
        <button onclick="randomizeGrid()">Random</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const rows = 50;
        const cols = 50;
        const cellSize = 12;

        canvas.width = cols * cellSize;
        canvas.height = rows * cellSize;

        let grid = createGrid();
        let interval = null;

        function createGrid() {
            return Array(rows)
                .fill()
                .map(() => Array(cols).fill(0));
        }

        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {

                    if (grid[r][c]) {
                        ctx.fillStyle = "#00ff88";
                        ctx.fillRect(
                            c * cellSize,
                            r * cellSize,
                            cellSize,
                            cellSize
                        );
                    }

                    ctx.strokeStyle = "#333";
                    ctx.strokeRect(
                        c * cellSize,
                        r * cellSize,
                        cellSize,
                        cellSize
                    );
                }
            }
        }

        function countNeighbors(row, col) {
            let count = 0;

            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {

                    if (i === 0 && j === 0) continue;

                    const r = row + i;
                    const c = col + j;

                    if (
                        r >= 0 &&
                        r < rows &&
                        c >= 0 &&
                        c < cols
                    ) {
                        count += grid[r][c];
                    }
                }
            }

            return count;
        }

        function nextGeneration() {
            const newGrid = createGrid();

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {

                    const neighbors = countNeighbors(r, c);

                    if (grid[r][c]) {
                        if (neighbors === 2 || neighbors === 3) {
                            newGrid[r][c] = 1;
                        }
                    } else {
                        if (neighbors === 3) {
                            newGrid[r][c] = 1;
                        }
                    }
                }
            }

            grid = newGrid;
            drawGrid();
        }

        function startGame() {
            if (!interval) {
                interval = setInterval(nextGeneration, 100);
            }
        }

        function stopGame() {
            clearInterval(interval);
            interval = null;
        }

        function clearGrid() {
            stopGame();
            grid = createGrid();
            drawGrid();
        }

        function randomizeGrid() {
            stopGame();

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    grid[r][c] = Math.random() > 0.7 ? 1 : 0;
                }
            }

            drawGrid();
        }

        canvas.addEventListener("click", e => {
            const rect = canvas.getBoundingClientRect();

            const x = Math.floor(
                (e.clientX - rect.left) / cellSize
            );

            const y = Math.floor(
                (e.clientY - rect.top) / cellSize
            );

            grid[y][x] = grid[y][x] ? 0 : 1;

            drawGrid();
        });

        drawGrid();
    </script>

</body>
</html>
